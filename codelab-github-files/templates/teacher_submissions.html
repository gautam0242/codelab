{% extends "base.html" %}{% block body %}<h2>Submissions</h2><form class="card row" method="get" aria-label="Filters">
<div><label for="fa">Assignment</label><select id="fa" name="assignment"><option value="">All</option>{% for a in assignments %}<option value="{{ a.id }}" {{ 'selected' if f.assignment==a.id|string }}>{{ a.title }}</option>{% endfor %}</select></div>
<div><label for="fs">Status</label><select id="fs" name="status"><option value="">All</option>{% for s in statuses %}<option {{ 'selected' if f.status==s }}>{{ s }}</option>{% endfor %}</select></div>
<div><label for="fu">Student</label><select id="fu" name="student"><option value="">All</option>{% for u in students %}<option value="{{ u.id }}" {{ 'selected' if f.student==u.id|string }}>{{ u.name }}</option>{% endfor %}</select></div><div><label>&nbsp;</label><button class="p">Filter</button></div></form>
<div class="card tw"><table><tr><th>Time (UTC)</th><th>Student</th><th>Assignment</th><th>#</th><th>Status</th><th>Tests</th><th></th></tr>{% for r in rows %}<tr><td>{{ r.created_at }}</td><td>{{ r.student }}</td><td>{{ r.title }}</td><td>{{ r.attempt }}</td><td><span class="b {{ r.status }}">{{ r.status }}</span></td><td>{{ r.passed_count }}/{{ r.total }}</td><td><a href="/teacher/submission/{{ r.id }}">Open</a> · <a href="/report/{{ r.id }}">Report</a></td></tr>{% else %}<tr><td colspan="7">No submissions match.</td></tr>{% endfor %}</table></div>{% endblock %}
