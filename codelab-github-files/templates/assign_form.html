{% extends "base.html" %}{% block body %}<div class="card"><h2>{{ 'Edit' if aid else 'New' }} assignment</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf }}">
<label for="t">Title</label><input id="t" name="title" value="{{ a.title }}" required maxlength="120"><div class="row"><div><label for="u">Unit</label><input id="u" name="unit" value="{{ a.unit }}" required placeholder="Unit 1: Basic I/O"></div><div><label for="d">Deadline</label><input id="d" name="deadline" type="date" value="{{ a.deadline }}"></div><div><label for="tl">CPU time limit (s)</label><input id="tl" name="time_limit" type="number" step="0.5" min="0.5" max="5" value="{{ a.time_limit or 2 }}"></div>
<div><label for="cm">Output comparison</label><select id="cm" name="compare_mode"><option value="lenient" {{ 'selected' if a.compare_mode!='exact' }}>Lenient (ignore trailing spaces / blank lines)</option><option value="exact" {{ 'selected' if a.compare_mode=='exact' }}>Exact (spaces matter)</option></select></div></div>
<label for="ds">Problem description</label><textarea id="ds" name="description" rows="4" required>{{ a.description }}</textarea>
<div class="row"><div><label for="if">Input format</label><textarea id="if" name="input_format" rows="3">{{ a.input_format }}</textarea></div><div><label for="of">Output format</label><textarea id="of" name="output_format" rows="3">{{ a.output_format }}</textarea></div><div><label for="cs">Constraints</label><textarea id="cs" name="constraints_text" rows="3">{{ a.constraints_text }}</textarea></div></div>
<label for="st">Starter code (blank = default template; do NOT put the solution here)</label><textarea id="st" name="starter" rows="6">{{ a.starter }}</textarea>
<h3>Test cases</h3><p class="mu">Sample tests are shown to students. Hidden tests and their expected outputs are never sent to students.</p><div id="tests">
{% for i, e, h in tests %}<div class="card row trow"><div><label>Input (stdin)</label><textarea name="t_input" rows="3">{{ i }}</textarea></div><div><label>Expected output</label><textarea name="t_expected" rows="3">{{ e }}</textarea></div><div><label>Visibility</label><select name="t_hidden"><option value="0" {{ 'selected' if not h }}>Sample (visible)</option><option value="1" {{ 'selected' if h }}>Hidden</option></select><p><button type="button" class="s rm">Remove</button></p></div></div>{% endfor %}</div>
<p><button type="button" class="s" id="addt">+ Add test case</button></p><button class="p">Save assignment</button></form></div>
<script src="{{ url_for('static', filename='form.js') }}"></script>{% endblock %}
