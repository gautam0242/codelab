# Render Blueprint. The database is NOT created here: Render's free Postgres expires after 30 days.
# Create a free Neon (or similar) Postgres, then paste its connection string into DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: codelab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_API_KEY
        sync: false
      - key: JUDGE0_API_HOST
        sync: false
      - key: JUDGE0_USE_WAIT
        value: "0"
